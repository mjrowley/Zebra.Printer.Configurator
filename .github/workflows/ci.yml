name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore Zebra.Printer.Configurator.slnx

      - name: Build
        run: dotnet build Zebra.Printer.Configurator.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Zebra.Printer.Configurator.UnitTests/Zebra.Printer.Configurator.UnitTests.csproj --no-build --configuration Release --logger "trx"

      - name: Component tests
        run: dotnet test tests/Zebra.Printer.Configurator.ComponentTests/Zebra.Printer.Configurator.ComponentTests.csproj --no-build --configuration Release --logger "trx"

      # Only the CI-runnable subset lives here (fake-TCP-server SGD protocol tests).
      # Real NFC/Bluetooth tests need physical hardware and run as a separate, manually
      # triggered device-lab suite - see plan Phase 5/6.
      - name: Integration tests (CI-runnable subset)
        run: dotnet test tests/Zebra.Printer.Configurator.IntegrationTests/Zebra.Printer.Configurator.IntegrationTests.csproj --no-build --configuration Release --logger "trx"
